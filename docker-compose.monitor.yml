# Long-running alert monitor (replaces the host cron line for monitor_scalp /
# check_alerts). Runs the same backend image, one pass per minute, and writes a
# heartbeat that the Notifications page shows ("last check: 40s ago").
# If you keep a host cron for monitor_scalp, remove it after enabling this.
services:
  alert-monitor:
    image: smartpips-backend
    container_name: smartpips-alert-monitor
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      POSTGRES_HOST: smartpips-postgres
      POSTGRES_PORT: "5432"
    networks:
      - smartpips_network
    command: ["python", "manage.py", "monitor_scalp", "--loop", "--interval", "60", "--with-rules"]
    stop_grace_period: 30s
