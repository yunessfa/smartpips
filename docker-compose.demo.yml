services:
  demo-monitor:
    image: smartpips-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      POSTGRES_HOST: smartpips-postgres
      POSTGRES_PORT: "5432"
    networks:
      - smartpips_network
    command: ["python", "manage.py", "monitor_demo", "--loop", "--interval", "10"]
    stop_grace_period: 30s