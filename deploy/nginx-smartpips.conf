# /etc/nginx/sites-available/smartpips.conf
# Serves the built React app and proxies the API/admin to Gunicorn.

server {
    listen 80;
    listen [::]:80;
    server_name smartpips.ir www.smartpips.ir;

    # If you install a Cloudflare Origin Certificate (recommended), uncomment the
    # 443 block below and the redirect, then reload nginx. With Cloudflare's
    # "Full (strict)" SSL mode this gives end-to-end HTTPS.
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    # 1) React build (Vite output)
    root /var/www/smartpips/frontend/dist;
    index index.html;

    # 2) Django admin/DRF static files (collectstatic)
    location /static/ {
        alias /var/www/smartpips/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # 3) API + admin -> Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 4) SPA fallback: any other path returns index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

